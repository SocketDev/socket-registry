name: 'ci: gates'
run-name: 'ci: gates'

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - &checkout
        name: Check out the workflow revision
        shell: bash
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init --quiet
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.$GITHUB_SERVER_URL/.extraheader" \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git fetch --quiet --tags origin "$GITHUB_SHA"
          git checkout --quiet --detach FETCH_HEAD
      - name: Check repository
        run: bash scripts/ci/with-toolchain.sh pnpm run check

  test:
    name: Test (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - *checkout
      - name: Build and run tests
        run: bash scripts/ci/with-toolchain.sh bash -e -c 'pnpm run build && pnpm test'

  test-npm-packages:
    name: Test npm packages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - *checkout
      - name: Build and test npm packages
        run: bash scripts/ci/with-toolchain.sh bash -e -c 'pnpm run build && pnpm run test:npm'

  floor-node-smoke:
    name: Floor node smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - *checkout
      - name: Run npm packages on the minimum Node.js version
        run: bash scripts/ci/with-toolchain.sh pnpm run test:npm:floor
