name: 📦 npm publish packages

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Stage packages for approval. The default is a dry run.'
        type: boolean
        default: false
      dist-tag:
        description: 'npm dist-tag to stage under.'
        type: string
        default: 'latest'
      only:
        description: 'Optional comma-separated package names. An empty list selects every override package that needs publishing.'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: npm-publish-packages-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    name: Stage npm packages
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # npm trusted publishing matches this environment.
    environment: publish-npm
    permissions:
      contents: read
      id-token: write # Required for npm trusted publishing.
    steps:
      - name: Check out the workflow revision
        shell: bash
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init --quiet
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.$GITHUB_SERVER_URL/.extraheader" \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git fetch --quiet --tags origin "$GITHUB_SHA"
          git checkout --quiet --detach FETCH_HEAD
      - name: Restrict the latest dist-tag to the default branch
        if: inputs.publish && inputs.dist-tag == 'latest'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Dispatch from $DEFAULT_BRANCH to stage the latest dist-tag." >&2
            exit 1
          fi
      - name: Stage packages
        env:
          DIST_TAG: ${{ inputs.dist-tag }}
          ONLY: ${{ inputs.only }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          args=(--force-publish --dist-tag "$DIST_TAG")
          if [[ -n "$ONLY" ]]; then args+=(--only "$ONLY"); fi
          if [[ "$PUBLISH" != true ]]; then args+=(--dry-run); fi
          bash scripts/ci/with-toolchain.sh bash -e -c '
            pnpm run build
            pnpm run package-npm-publish "$@"
          ' bash "${args[@]}"
